name: build

on:
  push:
  pull_request:

jobs:
  linux:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/${{ matrix.compiler }} -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DRIFT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/${{ matrix.compiler }} --parallel
      - name: Test
        run: ctest --test-dir build/${{ matrix.compiler }} --output-on-failure
      # CMakeLists.txt maps the GNU compiler ID to "gcc", so these paths match
      # the matrix names. ctest's rift_ci_artifact_layout checks the same.
      - name: Check artifacts
        run: |
          test -f build/bin/linux-${{ matrix.compiler }}/rift.a
          test -f build/bin/linux-${{ matrix.compiler }}/rift.so
          test -f build/bin/linux-${{ matrix.compiler }}/riftlang.a
          test -f build/bin/linux-${{ matrix.compiler }}/riftlang.so
          test -f build/bin/linux-${{ matrix.compiler }}/rifttest.a
          test -f build/bin/linux-${{ matrix.compiler }}/rifttest.so
          nm -D build/bin/linux-${{ matrix.compiler }}/rift.so | grep rift_regex_compile
          nm -D build/bin/linux-${{ matrix.compiler }}/riftlang.so | grep rlang_compile
          nm -D build/bin/linux-${{ matrix.compiler }}/rifttest.so | grep rtest_run_suite

  # Debug keeps assert() active and builds without NDEBUG, so the suite runs
  # under both settings.
  linux-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/debug -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DRIFT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/debug --parallel
      - name: Test
        run: ctest --test-dir build/debug --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/msvc -DRIFT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/msvc --config Release --parallel
      - name: Test
        run: ctest --test-dir build/msvc -C Release --output-on-failure
      # dumpbin is only on PATH in a Visual Studio developer shell, so the
      # step finds it with vswhere. Each check names what it found missing.
      - name: Check artifacts
        shell: pwsh
        run: |
          $dir = "build/bin/windows-msvc"
          foreach ($file in "rift.dll", "rift.lib", "riftlang.dll", "rifttest.dll") {
            if (-not (Test-Path "$dir/$file")) {
              Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
              throw "missing artifact: $dir/$file"
            }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found through $vswhere" }
          $exports = [ordered]@{
            "rift.dll"     = "rift_regex_compile"
            "riftlang.dll" = "rlang_compile"
            "rifttest.dll" = "rtest_run_suite"
          }
          foreach ($dll in $exports.Keys) {
            $listing = & $dumpbin /exports "$dir/$dll"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $dir/$dll" }
            if (-not ($listing | Select-String -SimpleMatch $exports[$dll])) {
              throw "$dir/$dll does not export $($exports[$dll])"
            }
            Write-Host "$dll exports $($exports[$dll])"
          }

  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/mingw -G "MinGW Makefiles" -DRIFT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/mingw --parallel
      - name: Test
        run: ctest --test-dir build/mingw --output-on-failure
      - name: Check artifacts
        shell: pwsh
        run: |
          if (!(Test-Path build/bin/windows-mingw/rift.a)) { exit 1 }
          if (!(Test-Path build/bin/windows-mingw/rift.dll)) { exit 1 }
          if (!(Test-Path build/bin/windows-mingw/riftlang.a)) { exit 1 }
          if (!(Test-Path build/bin/windows-mingw/riftlang.dll)) { exit 1 }
          if (!(Test-Path build/bin/windows-mingw/rifttest.a)) { exit 1 }
          if (!(Test-Path build/bin/windows-mingw/rifttest.dll)) { exit 1 }
          objdump -p build/bin/windows-mingw/rift.dll | Select-String rift_regex_compile
          objdump -p build/bin/windows-mingw/riftlang.dll | Select-String rlang_compile
          objdump -p build/bin/windows-mingw/rifttest.dll | Select-String rtest_run_suite
